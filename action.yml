name: "TruthSync — Docs Reality Check"
description: "Find documentation that disagrees with repository status, commands, or package version"
author: "jonathan-shizuka"

branding:
  icon: "check-circle"
  color: "purple"

inputs:
  config:
    description: "Path to the TruthSync configuration file"
    required: false
    default: ".truthsync.yml"
  fail-on:
    description: "Failure threshold: error, warning, or never"
    required: false
    default: "error"

outputs:
  findings-count:
    description: "Total number of findings"
  errors-count:
    description: "Number of error-severity findings"
  warnings-count:
    description: "Number of warning-severity findings"
  report-path:
    description: "Path to the JSON evidence report"

runs:
  using: "node24"
  main: "dist/index.js"
